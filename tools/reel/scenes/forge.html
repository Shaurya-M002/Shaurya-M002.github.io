<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../scene.css">
<style>
  .code { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 30px 38px; font: 400 34px/1.55 var(--mono); color: var(--fg); width: 640px; height: 170px; margin: 0; }
  .code .kw { color: var(--accent); }
  .code .fn { color: #c9c3b6; }
  .cursor { display: inline-block; width: 16px; height: 36px; background: var(--accent); vertical-align: -6px; margin-left: 2px; }
  #result { font: 500 38px var(--sans); }
  #result .sub { font: 400 22px var(--mono); color: var(--muted); margin-top: 12px; }
  .cap { font: 500 22px var(--mono); color: var(--muted); margin-bottom: 26px; letter-spacing: .02em; }
  .row { display: grid; grid-template-columns: 250px 1fr 130px; align-items: center; height: 78px; }
  .row .n { font: 400 28px var(--mono); color: var(--fg); }
  .row .track { height: 14px; border-radius: 7px; background: var(--line); position: relative; overflow: hidden; }
  .row .bar { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 7px; background: var(--accent); }
  .row .v { font: 500 32px var(--sans); text-align: right; font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div id="stage">
  <div class="label"><i></i>forge-kernels</div>
  <div class="brand">shaurya madukuri</div>
  <div class="h abs" id="h" style="left:120px; top:250px; width:780px">fused triton kernels,<br><em>one call.</em></div>
  <pre class="code abs" id="code" style="left:120px; top:530px"></pre>
  <div class="abs" id="result" style="left:120px; top:780px"><span class="acc">1.20× faster</span> &nbsp;·&nbsp; <span class="acc">36% less memory</span>
    <div class="sub">qwen2.5-0.5b fine-tune · batch 4 × 1024 · bf16</div></div>
  <div class="abs" id="bars" style="left:1000px; top:268px; width:800px"><div class="cap" id="cap">best recorded speedup vs pytorch eager</div></div>
  <div class="foot" id="foot">a100-80gb · 660 tests pass · every number from a committed result file</div>
</div>
<script src="../scene.js"></script>
<script>
window.DURATION = 7;
const src = 'import forge\n\nforge.patch(model)';
const data = [['rmsnorm', 10.2], ['rope', 7.1], ['swiglu', 6.5], ['geglu', 5.2], ['cross-entropy', 2.77], ['layernorm', 1.57]];
const bars = $('#bars');
const rows = data.map(([n, v]) => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="n">${n}</div><div class="track"><div class="bar"></div></div><div class="v"></div>`;
  bars.appendChild(r); return { r, bar: r.querySelector('.bar'), v: r.querySelector('.v'), val: v };
});
function hl(s) {
  return s.replace(/\bimport\b/, '<span class="kw">import</span>').replace(/\.patch/, '.<span class="fn">patch</span>');
}
window.draw = (t) => {
  show($('#h'), prog(t, 0.2, 1.1));
  show($('#code'), prog(t, 0.5, 1.2), 16);
  const n = Math.floor(clamp((t - 0.9) / 1.3) * src.length);
  const blink = t < 2.4 || Math.floor(t * 2) % 2 === 0;
  $('#code').innerHTML = hl(src.slice(0, n)) + (blink ? '<span class="cursor"></span>' : '');
  show($('#result'), prog(t, 2.5, 3.2), 18);
  show($('#cap'), prog(t, 1.0, 1.6), 10);
  rows.forEach((o, i) => {
    const k = prog(t, 1.3 + i * 0.22, 2.6 + i * 0.22, ease.expo);
    show(o.r, prog(t, 1.1 + i * 0.22, 1.6 + i * 0.22), 12);
    o.bar.style.width = (k * o.val / 10.2 * 100) + '%';
    o.v.textContent = (o.val * k).toFixed(o.val < 3 ? 2 : 1) + '×';
  });
  show($('#foot'), prog(t, 3.2, 3.8), 10);
};
</script>
</body></html>
